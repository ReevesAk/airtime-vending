services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airtime
      POSTGRES_USER: airtime
      POSTGRES_PASSWORD: airtime
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airtime"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pg_data:/var/lib/postgresql/data

  operator:
    build: ./operator
    ports:
      - "9000:9000"

  service:
    build: ./service
    depends_on:
      postgres:
        condition: service_healthy
      operator:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: airtime
      POSTGRES_USER: airtime
      POSTGRES_PASSWORD: airtime
      OPERATOR_BASE_URL: http://operator:9000
      OPERATOR_CALL_TIMEOUT_SECONDS: "4.5"
      USSD_SESSION_TTL_SECONDS: "5"
      DJANGO_DEBUG: "true"
    ports:
      - "8000:8000"

volumes:
  pg_data:
